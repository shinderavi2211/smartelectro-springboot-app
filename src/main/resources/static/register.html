<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#172321">
    <title>Create account | Smart Electro Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="auth-page">
    <nav class="navbar auth-nav"><div class="nav-container"><a class="nav-logo" href="/"><span class="brand-mark">SE</span><span>SmartElectro</span></a><a href="/" class="nav-link">Back to store</a></div></nav>
    <main class="auth-shell">
        <aside class="auth-aside"><h1>Get your next job <span>powered up.</span></h1><p>Set up your account to shop electrical and wiring essentials.</p></aside>
        <section class="auth-panel" aria-labelledby="registerTitle">
            <p class="eyebrow">JOIN SMART ELECTRO</p>
            <h2 id="registerTitle">Create your account</h2>
            <p class="auth-intro">A few details and you are ready to browse.</p>
            <form id="registerForm" class="auth-form">
                <div class="form-group"><label for="email">Email address</label><input type="email" id="email" name="email" autocomplete="email" required></div>
                <div class="form-group"><label for="password">Password</label><input type="password" id="password" name="password" autocomplete="new-password" required minlength="8" aria-describedby="passwordNote"><p id="passwordNote" class="password-note">Use at least 8 characters.</p></div>
                <button type="submit" class="submit-btn">Create account</button>
            </form>
            <div id="message" class="auth-message" role="status" aria-live="polite"></div>
            <div class="auth-links"><span>Already registered?</span><a href="/login.html">Log in</a></div>
        </section>
    </main>
    <script>
        const params = new URLSearchParams(window.location.search);
        const requestedPath = params.get('returnUrl');
        const returnPath = requestedPath && requestedPath.startsWith('/') && !requestedPath.startsWith('//') ? requestedPath : '/';
        document.querySelector('.auth-links a').href = `/login.html?returnUrl=${encodeURIComponent(returnPath)}`;

        async function register(event) {
            event.preventDefault();
            const message = document.getElementById('message');
            const button = event.currentTarget.querySelector('button[type="submit"]');
            button.disabled = true;
            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
                });
                const result = await response.text();
                if (!response.ok) throw new Error(result || 'Registration failed. Please try again.');
                message.className = 'auth-message success';
                message.textContent = 'Account created. Redirecting to login...';
                window.setTimeout(() => window.location.assign(`/login.html?returnUrl=${encodeURIComponent(returnPath)}`), 1000);
            } catch (error) {
                message.className = 'auth-message error';
                message.textContent = error.message || 'Registration failed. Please try again.';
                button.disabled = false;
            }
        }
        document.getElementById('registerForm').addEventListener('submit', register);
    </script>
</body>
</html>
